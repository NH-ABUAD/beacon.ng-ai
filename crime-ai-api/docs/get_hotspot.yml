tags:
  - Hotspots

summary: Get hotspot details

description: >
  Retrieves a single hotspot cluster by its unique identifier.

produces:
  - application/json

parameters:
  - in: path
    name: cluster_id
    required: true
    type: string
    description: Unique hotspot cluster identifier.

responses:
  200:
    description: GeoJSON Feature representing the hotspot.

  404:
    description: Cluster not found.